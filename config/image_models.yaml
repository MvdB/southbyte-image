# Registry der Bild-Modelle für den southbyte-image Harness.
# loader: auto | diffusion | mage_flow | flux2_singlefile | flux2_bnb | flux3_modular | ideogram4 | hidream_o1
#         (siehe serving/loaders.py)
# active:false = Modell definiert, aber Serving-Deps noch nicht im Image (v2 nötig).
defaults:
  size: "1024x1024"
  dtype: bfloat16
  # Testsatz v2 seit 2026-09-22: wie v1, aber mit Negativ-Prompt je Fall. Ohne
  # ihn bleibt true_cfg_scale bei den Qwen-Pipelines wirkungslos. Zahlen aus v1
  # und v2 sind NICHT vergleichbar — der Testsatz steht deshalb in summary.json.
  testset: "testset/image_de_v2.jsonl"
  # v2 statt v1: das v1-Image liegt seit 22.09. nicht mehr lokal, und v2 ist
  # laut HARNESS seine Obermenge (gleiche diffusers-Basis plus schwere Deps).
  image: "spark-southbyte-image:v2"

models:
  - name: FLUX.1-schnell
    dir: black-forest-labs--FLUX.1-schnell
    loader: auto
    steps: 4
    guidance: 0.0
    active: true
    notes: "timestep-distilliert, guidance-frei (guidance_scale 0.0). ~54 GB, passt allein."

  - name: Qwen-Image-2512
    dir: Qwen--Qwen-Image-2512
    loader: auto
    steps: 20
    guidance: 3.5
    active: true
    notes: "QwenImagePipeline, true_cfg. ~54 GB. Das Handprofil nannte 50 Schritte bei 1328x1328 als Startwert; gemessen wird mit 20 Schritten bei 1024x1024 wie die uebrige Reihe."

  - name: Qwen-Image-Flash
    dir: nvidia--Qwen-Image-Flash
    loader: auto
    steps: 8
    # 1.0 statt 3.5 seit 2026-09-29: das Modell ist ein DISTILLAT und laut
    # handvalidiertem Profil auf true_cfg_scale ~1.0 ausgelegt. Mit Testsatz v1
    # war der Wert folgenlos (ohne Negativ-Prompt wirkt true_cfg_scale nicht),
    # mit v2 wirkt er — der Lauf vom 27.09. lief also ausserhalb des
    # Betriebspunkts des Modells.
    guidance: 1.0
    active: true
    notes: "Sweet Spot Durchsatz/Qualität. Distillat: true_cfg_scale ~1.0, nicht 3.5. ~54 GB."

  - name: Qwen-Image-2.1
    dir: Qwen--Qwen-Image-2.1
    loader: diffusion            # QwenImage21Pipeline steht NICHT im AutoPipeline-Mapping
                                 # (geprueft 22.09.), nur DiffusionPipeline liest _class_name
    steps: 40                    # Modellkarte
    guidance: 3.5
    size: "1024x1024"            # Kohorten-Aufloesung; die Karte nennt nur 2048er-Formate
    active: true
    image: "spark-southbyte-image:v3"
    notes: "Braucht v3: QwenImage21Pipeline steckt in keinem diffusers-Release (auch 0.40.0 nicht), erst im Hauptzweig seit 2026-09-18 (PR #14804); dazu transformers >=5.17, was mit dem <5.6-Pin von Mage-Flow unvereinbar ist. Deshalb eigenes Image, Mage-Flow bleibt auf v2. Gemessen bei 1024x1024 wie die uebrige Kohorte — die Modellkarte nennt als Formate nur 2048er-Kantenlaengen, dazu gibt es einen Seitenlauf ueber 5 Faelle. LIZENZ: Qwen Research License (nicht apache-2.0 wie 2512) — Nutzung nur zu Forschungs- und Evaluationszwecken, kommerziell nur mit eigener Lizenz von Qwen. Gilt auch fuer die erzeugten Bilder; Veroeffentlichung der Messbilder am 22.09.2026 bewusst entschieden, Hinweis steht auf der Vergleichsseite."

  - name: Qwen-Image-2.1-Turbo
    dir: Qwen--Qwen-Image-2.1-Turbo
    loader: diffusion            # wie 2.1: QwenImage21Pipeline steht nicht im AutoPipeline-Mapping
    steps: 8                     # Modellkarte; der Checkpoint bringt seinen 8-Schritt-Zeitplan mit
    # 1.0, nicht 3.5: das Modell ist ein DISTILLAT und laut Karte auf CFG=1
    # ausgelegt — dieselbe Lage wie bei Qwen-Image-Flash. Der Testsatz v2 gibt
    # je Fall einen Negativ-Prompt mit; bei true_cfg_scale 1.0 bleibt der
    # folgenlos, und genau so soll es sein. Mit 3.5 wuerde der Negativ-Prompt
    # echte CFG einschalten, die Rechenzeit verdoppeln und das Distillat
    # ausserhalb seines Betriebspunkts messen.
    guidance: 1.0
    size: "1024x1024"            # Kohorten-Aufloesung; die Karte nennt 1680x2512
    active: true                 # Gewichte vollstaendig seit 14.10.2026 (32 von 32 gegen den Hub)
    image: "spark-southbyte-image:v3.1"
    notes: "GEMESSEN 14.10.2026 (Lauf 2026-10-14_2252, Testsatz v2): 22/22 Bilder, Prompt-Treue 0,936, Text-CER 0,000, exakt getroffen 100 %, 11,6 s je Bild. BEFUND: die Beschleunigung kostet nichts. Gegen Qwen-Image-2.1 auf demselben Testsatz (0,927 Treue, CER 0,000, 100 % exakt, 109,0 s) ist das Textrendering unveraendert perfekt und die Treue um 0,009 besser — Rauschen, kein Befund — bei Faktor 9,4 in der Geschwindigkeit. Zum Einordnen: ERNIE-Image-Turbo, bisher die Referenz fuer Treue und Text, braucht 122 s je Bild. ACHTUNG BEIM VERGLEICHEN: die 55,5 s, die fuer Qwen-Image-2.1 herumgeistern, stammen aus dem v1-Lauf vom 22.09. OHNE Negativ-Prompt. Auf v2 braucht 2.1 109 s, weil der Negativ-Prompt bei true_cfg_scale 3.5 echte CFG einschaltet und die Rechenzeit verdoppelt. Turbo laeuft mit guidance 1.0 und ist davon unberuehrt — das ist sein Betriebspunkt, nicht ein Vorteil im Aufbau. || VORGESCHICHTE: VORBEREITET 09.10.2026, Gewichte kamen mit dem Sync. Beschleunigter Checkpoint von Qwen-Image-2.1: gleiche 7B-Architektur, 8 statt 40 Schritte, CFG=1, prefix KV caching. BRAUCHT v3.1 und nicht v3: das Turbo-Distillat bringt seinen Zeitplan IM CHECKPOINT mit, und erst PR #14950 (gemergt 05.10.2026) liest ihn als sample_sigmas. Der v3-Pin 6256aa7666ce ist vom 18.09. und kennt sample_sigmas nicht — im Image nachgesehen, 0 Treffer im Pipeline-Quelltext. Mit v3 liefen die 8 Schritte auf dem falschen Zeitplan: es liefe, saehe aber schlechter aus, und gemessen waere die Distillation statt des Modells. LIZENZ: Qwen Research License wie 2.1 — Nutzung nur zu Forschungs- und Evaluationszwecken, gilt auch fuer die erzeugten Bilder. ERWARTUNG, die der Lauf pruefen soll: 2.1 hatte das beste Textrendering der Kohorte (CER 0,000) bei 55 s/Bild und nur mittlere Treue. Turbo mit 8 statt 40 Schritten sollte deutlich schneller sein — die Frage ist, was das Textrendering kostet."

  - name: ERNIE-Image-Turbo
    dir: baidu--ERNIE-Image-Turbo
    loader: diffusion            # ErnieImagePipeline (Custom-Klasse in diffusers 0.38)
    steps: 8
    guidance: 3.5
    active: true
    notes: "beste Prompt-Treue + Textrendering; ~122s/Bild"

  # --- braucht v4-Image ---
  - name: FLUX.3-klein
    dir: black-forest-labs--flux-3-image-klein
    # Rezept recipes.vllm.ai/black-forest-labs/flux-3-image-klein: vLLM-Omni mit
    # Day-0-Image (arm64 vorhanden), Upsampler als eigener Dienst auf stock vLLM.
    # Der diffusers-Weg (loader flux3_modular, Image v4) bleibt als Rueckfall in
    # serving/loaders.py; fuer ihn backend und upsampler entfernen und loader,
    # components_dir, prompt_upsampler und image v4 wieder setzen.
    backend: omni
    image: "vllm/vllm-omni:flux-3-image-klein"
    upsampler:
      dir: black-forest-labs--flux-3-image-klein-pup   # Qwen3.5-9B-Finetune, Apache-2.0
      image: "vllm/vllm-openai:v0.29.0"                # laut Rezept
    negative_prompt: false       # das Distillat lehnt negative_prompt und guidance_scale ab (Rezept)
    size: "1024x1024"
    active: true                 # 2026-10-24 gemessen
    notes: "FLUX 3 Image Klein, 5,6B-Transformer, Text-Encoder Qwen3-VL-4B, VAE aus FLUX.2; Distillat mit fester 16-Schritt-Folge ohne Guidance. Laeuft nach dem REZEPT ueber vLLM-Omni (vllm/vllm-omni:flux-3-image-klein), Schritte und Guidance setzt das Modell selbst. UPSAMPLER flux-3-image-klein-pup laut Rezept als eigener Dienst (vLLM v0.29.0); Aufruf nach seiner Karte: Systemprompt t2i aus system_prompts.json, gierig, top_p 0,95, top_k 20, presence_penalty 1,5, hoechstens 3584 Token, Denken aus. Der umgeschriebene Prompt steht je Fall als revised_prompt in den Ergebnissen, die Upsampler-Zeit als upsample_seconds; gen_seconds enthaelt sie. Der Upsampler schreibt Englisch, zitierter Text behaelt seine Sprache, bewertet wird gegen den deutschen Original-Prompt. LIZENZ: FLUX Kommunity License v1.0, nicht-kommerziell erlaubt; kommerzielle Nutzung der Bilder nur fuer Qualifying User unter 5 Mio. US-Dollar Jahresumsatz, dann mit Inhaltsfilter oder Pruefung vor Veroeffentlichung und KI-Kennzeichnung, soweit gesetzlich verlangt. Upsampler Apache-2.0, Text-Encoder Apache-2.0."

  # --- 2026-10-25 vorbereitet: Krea-2-Turbo, ideogram-4, Ming-Image, HiDream-O1 ---
  # Kein Rezept auf recipes.vllm.ai fuer krea, ideogram-ai und HiDream-ai (geprueft
  # 25.10.); fuer Ming-Image gibt es eins im vLLM-Omni-Repo. Werte nach Modellkarte.
  - name: Krea-2-Turbo
    dir: krea--Krea-2-Turbo
    loader: diffusion            # Krea2Pipeline (diffusers-Hauptzweig) ueber _class_name
    steps: 8                     # Modellkarte
    guidance: 0.0                # Karte: guidance_scale 0.0; CFG ist damit aus, die
                                 # Pipeline ignoriert den Negativ-Prompt bei <= 0
    size: "1024x1024"
    active: true
    image: "spark-southbyte-image:v4.1"
    notes: "Krea 2 Turbo, Destillat (is_distilled: festes mu 1,15), Text-Encoder Qwen3-VL, VAE von Qwen-Image; ~58 GB BF16, passt allein. Karte: 8 Schritte, guidance 0,0, beste Qualitaet bei 2048x2048 — gemessen wird bei 1024x1024 wie die Kohorte. LIZENZ: Krea 2 Community License v1 (22.06.2026): nicht-kommerziell frei, kommerziell nur unter 1 Mio. US-Dollar Jahresumsatz (inkl. verbundener Unternehmen), sonst Enterprise-Lizenz. Inhaltsfilter-Pflicht fuer jeden Einsatz (4.2, Pruefung durch Menschen genuegt): fester, harmloser Testsatz und Durchsicht jedes Bildes vor der Veroeffentlichung. KI-Kennzeichnung, soweit verlangt: die EU-Kennzeichnung sitzt auf jedem Bild."

  - name: ideogram-4
    dir: ideogram-ai--ideogram-4-nf4-diffusers   # die diffusers-Fassung; ideogram-4-nf4 hat fusionierte qkv-Gewichte
    loader: ideogram4            # NF4 (bitsandbytes) + lokales Prompt-Upsampling
    components_dir: diffusers--qwen3-vl-8b-instruct-lm-head   # LM-Kopf fuer das Upsampling
    prompt_upsampler: true
    steps: 48                    # Laenge des Standard-Guidance-Plans (45 x 7,0 + 3 x 3,0)
    guidance: none               # Plan statt konstantem Wert; guidance_scale daneben lehnt die Pipeline ab
    size: "1024x1024"
    galerie: true                # Nutzerentscheid 25.10.: Bilder mit Lizenzhinweis zeigen (false = nur Messwerte)
    active: true
    image: "spark-southbyte-image:v4.1"
    seitenhinweis: "in 6 der 22 Bilder steht der Platzhalter 'Image blocked by safety filter', fuenfmal als graue Flaeche anstelle des Motivs, einmal ueber die fertige Szene gelegt, auch bei harmlosen Prompts. Laut Ideogram liefert das Modell selbst diesen Platzhalter; ein eigener Filter laeuft hier nicht. Ohne die fuenf grauen Flaechen laege die Prompt-Treue bei 0,976 statt 0,764, und die Textrendering-CER stammt allein aus dem einen blockierten Textfall."
    notes: "Ideogram 4 (NF4, ~16 GB): zwei Transformer (bedingt + unbedingt), Text-Encoder Qwen3-VL-8B. Das Modell erwartet seine strukturierte JSON-Beschreibung als Prompt. Die gehostete Magic-Prompt-API ist ausgeschlossen (Testprompts verlassen die Maschine nicht); lokal schreibt der Text-Encoder mit dem LM-Kopf diffusers/qwen3-vl-8b-instruct-lm-head um (laut Karte mit etwas Qualitaetsverlust), JSON-gebunden ueber outlines, Temperatur 1,0 wie in diffusers. Umgeschriebener Prompt je Fall als revised_prompt. Karte: 1024 moeglich, bis 2048. LIZENZ: Ideogram Non-Commercial Model Agreement (03.06.2026): nur nicht-kommerziell, Unternehmen nur Test/Evaluation in nicht-produktiver Umgebung; keine Ausgaben zur Bewerbung umsatzbringender Produkte/Dienste, keine Ausgaben zum Training konkurrierender Modelle. Bilder werden mit diesem Lizenzhinweis gezeigt (Nutzerentscheid 25.10.2026: Vergleich aktueller Modelle, kein kommerzieller Zweck); galerie: false wuerde nur die Messwerte zeigen."

  - name: ideogram-4-ohne-Upsampling
    dir: ideogram-ai--ideogram-4-nf4-diffusers   # die diffusers-Fassung; ideogram-4-nf4 hat fusionierte qkv-Gewichte
    loader: ideogram4
    prompt_upsampler: false      # NUR solange der LM-Kopf nicht im Modellspeicher liegt
    steps: 48
    guidance: none
    size: "1024x1024"
    galerie: true
    active: false                # Ersatzzeile; laeuft nur ausdruecklich ueber --models
    image: "spark-southbyte-image:v4.1"
    notes: "Wie ideogram-4, aber ohne Prompt-Upsampling: das Modell bekommt den deutschen Prompt unveraendert statt seiner JSON-Beschreibung. NICHT der vorgesehene Betrieb (Karte: Upsampling fuer beste Ergebnisse) — nur als Ersatz, falls diffusers--qwen3-vl-8b-instruct-lm-head beim Lauf fehlt; Zahlen nicht mit der Upsampling-Zeile mischen. Lizenz wie ideogram-4."

  - name: Ming-Image-0.1-Design
    dir: inclusionAI--Ming-Image-0.1-Design
    # Rezept vllm-omni recipes/inclusionAI/Ming-Image.md: Zwei-Stufen-Serving
    # (Stufe 0 Qwen2.5-VL-Sichtteil + BailingMoeV2-Sprachmodell, Stufe 1 Z-Image-DiT
    # mit Qwen-Image-RGBA-VAE), Schnittstelle chat/completions mit modalities image.
    backend: omni
    api: chat
    image: "vllm/vllm-omni:v0.30.0"
    # Deploy-Config des Rezepts auf EINE GPU umgestellt (beide Stufen devices "0",
    # Anteile 0,35 + 0,30) — das Rezept nennt 2x H100; Datei serving/omni/.
    omni_args: ["--deploy-config", "/southbyte-omni/ming_image_einzel.yaml"]
    # Die config.json im Wurzelverzeichnis (nachgereicht 2026-10-14) lenkt vLLM-Omni auf
    # die Z-Image-Pipeline; ohne sie greift MingImageDiffusionPipeline (run_omni.sh).
    ausblenden: ["config.json"]
    steps: 12                    # Rezept
    guidance: 1.0                # Rezept; bei 1,0 keine CFG
    negative_prompt: false
    size: "1024x1024"
    active: true
    notes: "Ming-Image 0.1 Design (inclusionAI), ~50 GB. Nach dem Rezept ueber vLLM-Omni (Image v0.32.0rc1, arm64), einzige Abweichung: beide Stufen auf einer GPU (Rezept: zwei). Schritte 12, guidance 1,0, Seed fest je Fall nicht gesetzt (wie die Kohorte). Das Rezept erwaehnt einen Prompt-Refiner, nennt aber keinen veroeffentlichten — gemessen ohne. LIZENZ: MIT."

  - name: HiDream-O1-Image-Dev
    dir: HiDream-ai--HiDream-O1-Image-Dev-2604
    loader: hidream_o1           # eigener Modellcode (github.com/HiDream-ai/HiDream-O1-Image, dev, 3237a63)
    steps: 28                    # --model_type dev in inference.py
    guidance: 0.0                # dev: keine Guidance
    size: "2048x2048"            # der Modellcode rastet auf 2048x2048 ein (kleinstes Quadrat seiner Liste)
    active: true
    image: "spark-southbyte-image:hidream"
    refiner:                     # Prompt-Agent der Referenz, VORAB fuer alle Faelle
      dir: HiDream-ai--Prompt-Refine
      image: "vllm/vllm-openai:v0.24.0"   # wie das kuratierte Profil google--gemma-4-31B-it
      gpu_anteil: 0.65            # 59 GB Gewichte + KV fuer 8192 Token, 1 Anfrage; 0,80 kaeme dem Waechter zu nah
      args: ["--max-model-len", "8192", "--enable-auto-tool-choice", "--reasoning-parser", "gemma4",
             "--tool-call-parser", "gemma4",
             "--chat-template", "/hf_models/HiDream-ai--Prompt-Refine/tool_chat_template_gemma4.jinja",
             "--mm-processor-kwargs", '{"max_soft_tokens": 1120}', "--enforce-eager"]
    seitenhinweis: "rechnet in 2048x2048 statt 1024x1024 (kleinstes Format des Modells), und Ø Zeit/Bild enthaelt die Prompt-Ueberarbeitung durch Prompt-Refine (Gemma-4-31B) - Zeiten nicht direkt vergleichbar."
    notes: "HiDream-O1-Image-Dev-2604: Pixel-DiT auf Qwen3-VL-Basis, Gewichte float32 (~35 GB) wie inference.py, gerechnet unter bf16-Autocast, flash-attn aus der NGC-Basis (Schalter HIDREAM_FLASH_ATTN=0). Parameter wie --model_type dev: 28 Schritte, guidance 0, shift 1,0, Scheduler flash, noise_scale 8,0. AUFLOESUNG 2048x2048: der Modellcode kennt kein 1024er-Format — Zeiten daher nicht mit den 1024er-Laeufen vergleichbar. REFINER: HiDream-ai/Prompt-Refine (Gemma-4-31B-Finetune, ~59 GB) mit dem Prompt-Agenten der Referenz (prompt_agent_v2.refine_prompt), VORAB fuer alle 22 Faelle, weil Refiner und Bildmodell nicht gut nebeneinander passen; Flags wie start_vllm_server.sh der Referenz, dazu enforce-eager wie das kuratierte Gemma-4-31B-Profil. Refiner-Zeit zaehlt in gen_seconds. LIZENZ: MIT (Modell, Code, Refiner)."

  # --- brauchen v2-Image ---
  - name: Mage-Flow
    dir: M-vdBerg--Mage-Flow
    loader: mage_flow            # from mage_flow import MageFlowPipeline
    steps: 20
    guidance: 3.5
    active: true
    image: "spark-southbyte-image:v2"
    notes: "2026-08-11 aktiv (v2). _MageFlowAdapter (loaders.py) übersetzt die non-diffusers-API. FIX: transformers auf <5.6 gepinnt (5.6 entfernte create_causal_mask(input_embeds=) → screen_text-Gate crashte fail-closed → alles blockiert). Jetzt: Screening klassifiziert korrekt (benigne Prompts passieren, Gate intakt), echte Bilder. Text-Encoder sdpa (VF_HF_ATTN_IMPL). Mirror von microsoft/Mage (MIT)."

  - name: FLUX.2-klein-9b
    dir: black-forest-labs--FLUX.2-klein-9b-nvfp4
    loader: flux2_singlefile     # Single-File-NVFP4-Transformer + FLUX.2-Komponenten
    components_dir: black-forest-labs--FLUX.2-dev
    steps: 8
    guidance: 4.0
    active: false
    image: "spark-southbyte-image:v2"
    notes: "PENDING 2026-08-11: NVFP4-Transformer NICHT via diffusers ladbar — from_single_file-Konverter (convert_flux2_double_stream_blocks) crasht an den Quant-Scale-Tensoren (chunk expects >=1-dim), in diffusers 0.38 UND 0.39. torchao 0.18 + Komponenten (FLUX.2-dev voll) sind da, ändert nichts. Braucht anderen Runtime (ComfyUI/TensorRT-NVFP4-Loader) oder künftige diffusers-Unterstützung. FLUX.2-dev unquantisiert waere ~120GB → OOM-Risiko auf 121GB, nicht versucht."

  - name: FLUX.2-klein-4b
    dir: black-forest-labs--FLUX.2-klein-4b-nvfp4
    loader: flux2_singlefile
    components_dir: black-forest-labs--FLUX.2-dev
    steps: 8
    guidance: 4.0
    active: false
    image: "spark-southbyte-image:v2"
    notes: "PENDING 2026-08-11: wie klein-9b — NVFP4-Transformer laedt nicht via diffusers from_single_file (Quant-Scales), braucht nunchaku-FLUX2-Loader. Integration offen."

  - name: FLUX.2-dev
    dir: black-forest-labs--FLUX.2-dev-NVFP4
    loader: flux2_singlefile          # nutzt flux2-dev-nvfp4-mixed (Loader bevorzugt -mixed)
    components_dir: black-forest-labs--FLUX.2-dev
    steps: 20
    guidance: 4.0
    active: false                     # nach Smoke aktivieren
    image: "spark-southbyte-image:v2"
    notes: "WIP 2026-08-11: Durchbruch — NVFP4-mixed-Transformer LÄDT (Parameter-Patch im Image) + volle Pipeline PASST in Speicher (~70GB, kein OOM). ABER Inferenz blockiert: modelopt 0.44 ⟷ diffusers 0.38 quant-config-inkompatibel (_default_disabled_quantizer_cfg: List vs Dict) + pre_quantized-Pfad komprimiert Module nicht → gepackte NVFP4-Weights in normalen Linear → Forward-Shape-Fehler (6144 vs 3072). Braucht abgestimmte diffusers/modelopt-Versionen (eigenes Image, nicht mage_flows 0.38-Pin brechen) oder ComfyUI/TensorRT."

  - name: FLUX.2-dev-bnb4
    dir: diffusers--FLUX.2-dev-bnb-4bit    # noch zu synchen (LocalCache-Collection)
    loader: flux2_bnb                       # NF4 via bitsandbytes, from_pretrained(subfolder=transformer)
    components_dir: black-forest-labs--FLUX.2-dev
    steps: 20
    guidance: 4.0
    active: true                            # nach Sync + Smoke aktivieren
    image: "spark-southbyte-image:v2.1"   # v2 trug eine alte server_image.py (27.09.)
    notes: "2026-08-11: diffusers-nativer FLUX.2-dev-Weg (bitsandbytes-NF4, diffusers/FLUX.2-dev-bnb-4bit). Transformer als PROPER diffusers-Format im transformer/-Subfolder → normales from_pretrained lädt 4-bit (keine NVFP4-Single-File-Brüche). bnb 0.50 läuft auf sm_120 (getestet). WARTET auf Sync des Repos nach ~/hf_models."
