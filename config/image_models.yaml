# Registry der Bild-Modelle für den southbyte-image Harness.
# loader: auto | diffusion | mage_flow | flux2_singlefile | flux2_bnb | flux3_modular
#         (siehe serving/loaders.py)
# active:false = Modell definiert, aber Serving-Deps noch nicht im Image (v2 nötig).
defaults:
  size: "1024x1024"
  dtype: bfloat16
  # Testsatz v2 seit 2026-09-22: wie v1, aber mit Negativ-Prompt je Fall. Ohne
  # ihn bleibt true_cfg_scale bei den Qwen-Pipelines wirkungslos. Zahlen aus v1
  # und v2 sind NICHT vergleichbar — der Testsatz steht deshalb in summary.json.
  testset: "testset/image_de_v2.jsonl"
  # v2 statt v1: das v1-Image liegt seit 22.09. nicht mehr lokal, und v2 ist
  # laut HARNESS seine Obermenge (gleiche diffusers-Basis plus schwere Deps).
  image: "spark-southbyte-image:v2"

models:
  - name: FLUX.1-schnell
    dir: black-forest-labs--FLUX.1-schnell
    loader: auto
    steps: 4
    guidance: 0.0
    active: true
    notes: "timestep-distilliert, guidance-frei (guidance_scale 0.0). ~54 GB, passt allein."

  - name: Qwen-Image-2512
    dir: Qwen--Qwen-Image-2512
    loader: auto
    steps: 20
    guidance: 3.5
    active: true
    notes: "QwenImagePipeline, true_cfg. ~54 GB. Das Handprofil nannte 50 Schritte bei 1328x1328 als Startwert; gemessen wird mit 20 Schritten bei 1024x1024 wie die uebrige Reihe."

  - name: Qwen-Image-Flash
    dir: nvidia--Qwen-Image-Flash
    loader: auto
    steps: 8
    # 1.0 statt 3.5 seit 2026-09-29: das Modell ist ein DISTILLAT und laut
    # handvalidiertem Profil auf true_cfg_scale ~1.0 ausgelegt. Mit Testsatz v1
    # war der Wert folgenlos (ohne Negativ-Prompt wirkt true_cfg_scale nicht),
    # mit v2 wirkt er — der Lauf vom 27.09. lief also ausserhalb des
    # Betriebspunkts des Modells.
    guidance: 1.0
    active: true
    notes: "Sweet Spot Durchsatz/Qualität. Distillat: true_cfg_scale ~1.0, nicht 3.5. ~54 GB."

  - name: Qwen-Image-2.1
    dir: Qwen--Qwen-Image-2.1
    loader: diffusion            # QwenImage21Pipeline steht NICHT im AutoPipeline-Mapping
                                 # (geprueft 22.09.), nur DiffusionPipeline liest _class_name
    steps: 40                    # Modellkarte
    guidance: 3.5
    size: "1024x1024"            # Kohorten-Aufloesung; die Karte nennt nur 2048er-Formate
    active: true
    image: "spark-southbyte-image:v3"
    notes: "Braucht v3: QwenImage21Pipeline steckt in keinem diffusers-Release (auch 0.40.0 nicht), erst im Hauptzweig seit 2026-09-18 (PR #14804); dazu transformers >=5.17, was mit dem <5.6-Pin von Mage-Flow unvereinbar ist. Deshalb eigenes Image, Mage-Flow bleibt auf v2. Gemessen bei 1024x1024 wie die uebrige Kohorte — die Modellkarte nennt als Formate nur 2048er-Kantenlaengen, dazu gibt es einen Seitenlauf ueber 5 Faelle. LIZENZ: Qwen Research License (nicht apache-2.0 wie 2512) — Nutzung nur zu Forschungs- und Evaluationszwecken, kommerziell nur mit eigener Lizenz von Qwen. Gilt auch fuer die erzeugten Bilder; Veroeffentlichung der Messbilder am 22.09.2026 bewusst entschieden, Hinweis steht auf der Vergleichsseite."

  - name: Qwen-Image-2.1-Turbo
    dir: Qwen--Qwen-Image-2.1-Turbo
    loader: diffusion            # wie 2.1: QwenImage21Pipeline steht nicht im AutoPipeline-Mapping
    steps: 8                     # Modellkarte; der Checkpoint bringt seinen 8-Schritt-Zeitplan mit
    # 1.0, nicht 3.5: das Modell ist ein DISTILLAT und laut Karte auf CFG=1
    # ausgelegt — dieselbe Lage wie bei Qwen-Image-Flash. Der Testsatz v2 gibt
    # je Fall einen Negativ-Prompt mit; bei true_cfg_scale 1.0 bleibt der
    # folgenlos, und genau so soll es sein. Mit 3.5 wuerde der Negativ-Prompt
    # echte CFG einschalten, die Rechenzeit verdoppeln und das Distillat
    # ausserhalb seines Betriebspunkts messen.
    guidance: 1.0
    size: "1024x1024"            # Kohorten-Aufloesung; die Karte nennt 1680x2512
    active: true                 # Gewichte vollstaendig seit 14.10.2026 (32 von 32 gegen den Hub)
    image: "spark-southbyte-image:v3.1"
    notes: "GEMESSEN 14.10.2026 (Lauf 2026-10-14_2252, Testsatz v2): 22/22 Bilder, Prompt-Treue 0,936, Text-CER 0,000, exakt getroffen 100 %, 11,6 s je Bild. BEFUND: die Beschleunigung kostet nichts. Gegen Qwen-Image-2.1 auf demselben Testsatz (0,927 Treue, CER 0,000, 100 % exakt, 109,0 s) ist das Textrendering unveraendert perfekt und die Treue um 0,009 besser — Rauschen, kein Befund — bei Faktor 9,4 in der Geschwindigkeit. Zum Einordnen: ERNIE-Image-Turbo, bisher die Referenz fuer Treue und Text, braucht 122 s je Bild. ACHTUNG BEIM VERGLEICHEN: die 55,5 s, die fuer Qwen-Image-2.1 herumgeistern, stammen aus dem v1-Lauf vom 22.09. OHNE Negativ-Prompt. Auf v2 braucht 2.1 109 s, weil der Negativ-Prompt bei true_cfg_scale 3.5 echte CFG einschaltet und die Rechenzeit verdoppelt. Turbo laeuft mit guidance 1.0 und ist davon unberuehrt — das ist sein Betriebspunkt, nicht ein Vorteil im Aufbau. || VORGESCHICHTE: VORBEREITET 09.10.2026, Gewichte kamen mit dem Sync. Beschleunigter Checkpoint von Qwen-Image-2.1: gleiche 7B-Architektur, 8 statt 40 Schritte, CFG=1, prefix KV caching. BRAUCHT v3.1 und nicht v3: das Turbo-Distillat bringt seinen Zeitplan IM CHECKPOINT mit, und erst PR #14950 (gemergt 05.10.2026) liest ihn als sample_sigmas. Der v3-Pin 6256aa7666ce ist vom 18.09. und kennt sample_sigmas nicht — im Image nachgesehen, 0 Treffer im Pipeline-Quelltext. Mit v3 liefen die 8 Schritte auf dem falschen Zeitplan: es liefe, saehe aber schlechter aus, und gemessen waere die Distillation statt des Modells. LIZENZ: Qwen Research License wie 2.1 — Nutzung nur zu Forschungs- und Evaluationszwecken, gilt auch fuer die erzeugten Bilder. ERWARTUNG, die der Lauf pruefen soll: 2.1 hatte das beste Textrendering der Kohorte (CER 0,000) bei 55 s/Bild und nur mittlere Treue. Turbo mit 8 statt 40 Schritten sollte deutlich schneller sein — die Frage ist, was das Textrendering kostet."

  - name: ERNIE-Image-Turbo
    dir: baidu--ERNIE-Image-Turbo
    loader: diffusion            # ErnieImagePipeline (Custom-Klasse in diffusers 0.38)
    steps: 8
    guidance: 3.5
    active: true
    notes: "beste Prompt-Treue + Textrendering; ~122s/Bild"

  # --- braucht v4-Image ---
  - name: FLUX.3-klein
    dir: black-forest-labs--flux-3-image-klein
    loader: flux3_modular        # nur als ModularPipeline in diffusers, Upsampler aus components_dir
    components_dir: black-forest-labs--flux-3-image-klein-pup   # Prompt-Upsampler, Qwen3.5-9B-Finetune
    prompt_upsampler: true       # Modellkarte: nicht ohne Upsampler betreiben; false nur fuer Vergleichslaeufe
    steps: 16                    # Distillat, trainiert fuer 4 bis 16 Schritte; 16 ist der Standard der Pipeline
    guidance: 0.0                # keine CFG im Distillat; der Server verwirft guidance und Negativ-Prompt
    size: "1024x1024"
    active: false                # Gewichte noch nicht im Speicher; auf true nach dem ersten Lauf
    image: "spark-southbyte-image:v4"
    notes: "VORBEREITET 20.10.2026, Gewichte kommen mit dem Sync (klein und -pup). FLUX 3 Image Klein, 5,6B-Transformer, Text-Encoder Qwen3-VL-4B, VAE aus FLUX.2; Distillat mit 16 Schritten ohne Guidance. BRAUCHT v4: FLUX.3 gibt es nur im diffusers-Hauptzweig und nur als ModularPipeline, der Upsampler-Block erst seit PR #15058; v4 pinnt 4df4a5b35748. UPSAMPLER: laut Karte ist das Modell nicht ohne Upsampler zu betreiben. Er laeuft hier als Teil der Pipeline, kommt aber ausdruecklich aus components_dir, weil modular_model_index.json per Hub-ID auf das -pup-Repo zeigt und das offline nicht aufloesbar ist. Der umgeschriebene Prompt steht je Fall als revised_prompt in den Ergebnissen, die Upsampler-Zeit getrennt als upsample_seconds; gen_seconds enthaelt sie. Der Upsampler schreibt Englisch, zitierter Text behaelt seine Sprache, bewertet wird gegen den deutschen Original-Prompt. OFFEN: diffusers dekodiert den Upsampler greedy ohne die presence penalty 1,5, die die BFL-Referenz (vLLM) fuer Text-zu-Bild setzt; upsample_tokens_max in summary.json zeigt, ob ein Fall an 3584 Tokens stiess. SPEICHER laut diffusers-Doku rund 39 GB Gewichte mit Upsampler, rund 20 GB ohne. LIZENZ: FLUX Kommunity License v1.0, nicht-kommerziell erlaubt; kommerzielle Nutzung der Bilder nur fuer Qualifying User unter 5 Mio. US-Dollar Jahresumsatz, dann mit Inhaltsfilter oder Pruefung vor Veroeffentlichung und KI-Kennzeichnung, soweit gesetzlich verlangt. Upsampler Apache-2.0, Text-Encoder Apache-2.0."

  # --- brauchen v2-Image ---
  - name: Mage-Flow
    dir: M-vdBerg--Mage-Flow
    loader: mage_flow            # from mage_flow import MageFlowPipeline
    steps: 20
    guidance: 3.5
    active: true
    image: "spark-southbyte-image:v2"
    notes: "2026-08-11 aktiv (v2). _MageFlowAdapter (loaders.py) übersetzt die non-diffusers-API. FIX: transformers auf <5.6 gepinnt (5.6 entfernte create_causal_mask(input_embeds=) → screen_text-Gate crashte fail-closed → alles blockiert). Jetzt: Screening klassifiziert korrekt (benigne Prompts passieren, Gate intakt), echte Bilder. Text-Encoder sdpa (VF_HF_ATTN_IMPL). Mirror von microsoft/Mage (MIT)."

  - name: FLUX.2-klein-9b
    dir: black-forest-labs--FLUX.2-klein-9b-nvfp4
    loader: flux2_singlefile     # Single-File-NVFP4-Transformer + FLUX.2-Komponenten
    components_dir: black-forest-labs--FLUX.2-dev
    steps: 8
    guidance: 4.0
    active: false
    image: "spark-southbyte-image:v2"
    notes: "PENDING 2026-08-11: NVFP4-Transformer NICHT via diffusers ladbar — from_single_file-Konverter (convert_flux2_double_stream_blocks) crasht an den Quant-Scale-Tensoren (chunk expects >=1-dim), in diffusers 0.38 UND 0.39. torchao 0.18 + Komponenten (FLUX.2-dev voll) sind da, ändert nichts. Braucht anderen Runtime (ComfyUI/TensorRT-NVFP4-Loader) oder künftige diffusers-Unterstützung. FLUX.2-dev unquantisiert waere ~120GB → OOM-Risiko auf 121GB, nicht versucht."

  - name: FLUX.2-klein-4b
    dir: black-forest-labs--FLUX.2-klein-4b-nvfp4
    loader: flux2_singlefile
    components_dir: black-forest-labs--FLUX.2-dev
    steps: 8
    guidance: 4.0
    active: false
    image: "spark-southbyte-image:v2"
    notes: "PENDING 2026-08-11: wie klein-9b — NVFP4-Transformer laedt nicht via diffusers from_single_file (Quant-Scales), braucht nunchaku-FLUX2-Loader. Integration offen."

  - name: FLUX.2-dev
    dir: black-forest-labs--FLUX.2-dev-NVFP4
    loader: flux2_singlefile          # nutzt flux2-dev-nvfp4-mixed (Loader bevorzugt -mixed)
    components_dir: black-forest-labs--FLUX.2-dev
    steps: 20
    guidance: 4.0
    active: false                     # nach Smoke aktivieren
    image: "spark-southbyte-image:v2"
    notes: "WIP 2026-08-11: Durchbruch — NVFP4-mixed-Transformer LÄDT (Parameter-Patch im Image) + volle Pipeline PASST in Speicher (~70GB, kein OOM). ABER Inferenz blockiert: modelopt 0.44 ⟷ diffusers 0.38 quant-config-inkompatibel (_default_disabled_quantizer_cfg: List vs Dict) + pre_quantized-Pfad komprimiert Module nicht → gepackte NVFP4-Weights in normalen Linear → Forward-Shape-Fehler (6144 vs 3072). Braucht abgestimmte diffusers/modelopt-Versionen (eigenes Image, nicht mage_flows 0.38-Pin brechen) oder ComfyUI/TensorRT."

  - name: FLUX.2-dev-bnb4
    dir: diffusers--FLUX.2-dev-bnb-4bit    # noch zu synchen (LocalCache-Collection)
    loader: flux2_bnb                       # NF4 via bitsandbytes, from_pretrained(subfolder=transformer)
    components_dir: black-forest-labs--FLUX.2-dev
    steps: 20
    guidance: 4.0
    active: true                            # nach Sync + Smoke aktivieren
    image: "spark-southbyte-image:v2.1"   # v2 trug eine alte server_image.py (27.09.)
    notes: "2026-08-11: diffusers-nativer FLUX.2-dev-Weg (bitsandbytes-NF4, diffusers/FLUX.2-dev-bnb-4bit). Transformer als PROPER diffusers-Format im transformer/-Subfolder → normales from_pretrained lädt 4-bit (keine NVFP4-Single-File-Brüche). bnb 0.50 läuft auf sm_120 (getestet). WARTET auf Sync des Repos nach ~/hf_models."
