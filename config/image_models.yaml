# Registry der Bild-Modelle für den southbyte-image Harness.
# loader: auto | diffusion | mage_flow | flux2_singlefile  (siehe serving/loaders.py)
# active:false = Modell definiert, aber Serving-Deps noch nicht im Image (v2 nötig).
defaults:
  size: "1024x1024"
  dtype: bfloat16
  image: "spark-southbyte-image:v1"   # v2 gebaut (2026-08-11), aber kein v2-Modell aktiv → v1 für die 4 validen

models:
  - name: FLUX.1-schnell
    dir: black-forest-labs--FLUX.1-schnell
    loader: auto
    steps: 4
    guidance: 0.0
    active: true
    notes: "timestep-distilliert, guidance-frei"

  - name: Qwen-Image-2512
    dir: Qwen--Qwen-Image-2512
    loader: auto
    steps: 20
    guidance: 3.5
    active: true

  - name: Qwen-Image-Flash
    dir: nvidia--Qwen-Image-Flash
    loader: auto
    steps: 8
    guidance: 3.5
    active: true
    notes: "Sweet Spot Durchsatz/Qualität"

  - name: ERNIE-Image-Turbo
    dir: baidu--ERNIE-Image-Turbo
    loader: diffusion            # ErnieImagePipeline (Custom-Klasse in diffusers 0.38)
    steps: 8
    guidance: 3.5
    active: true
    notes: "beste Prompt-Treue + Textrendering; ~122s/Bild"

  # --- brauchen v2-Image ---
  - name: Mage-Flow
    dir: M-vdBerg--Mage-Flow
    loader: mage_flow            # from mage_flow import MageFlowPipeline
    steps: 20
    guidance: 3.5
    active: false
    image: "spark-southbyte-image:v2"
    notes: "PENDING 2026-08-11: v2-Image + _MageFlowAdapter (loaders.py) fertig, Modell LÄDT sauber. Blocker: mage_flows verpflichtende screen_text-Content-Gate ist FAIL-CLOSED und stuft JEDEN Prompt als violates=True ein (auch 'a red apple') → nur weiße Platzhalter. Interner Qwen3VL-Klassifikator (generate+JSON-parse) wirft Fehler → fail-closed. Fixbar (Screening in _vendor/mage_flow patchen/debuggen), aber zurückgestellt. Mirror von microsoft/Mage (MIT)."

  - name: FLUX.2-klein-9b
    dir: black-forest-labs--FLUX.2-klein-9b-nvfp4
    loader: flux2_singlefile     # Single-File-NVFP4-Transformer + FLUX.2-Komponenten
    components_dir: black-forest-labs--FLUX.2-dev-NVFP4
    steps: 8
    guidance: 4.0
    active: false
    image: "spark-southbyte-image:v2"
    notes: "PENDING 2026-08-11: v2-Image + nunchaku 0.16.1 fertig. Blocker: components_dir FLUX.2-dev-NVFP4 enthält lokal NUR den Transformer (kein model_index.json/text_encoder/VAE/tokenizer) → Flux2Pipeline nicht offline assemblierbar (will black-forest-labs/FLUX.2-dev vom Hub). SYNC nötig: volle FLUX.2-dev-Pipeline-Komponenten nach ~/hf_models."

  - name: FLUX.2-klein-4b
    dir: black-forest-labs--FLUX.2-klein-4b-nvfp4
    loader: flux2_singlefile
    components_dir: black-forest-labs--FLUX.2-dev-NVFP4
    steps: 8
    guidance: 4.0
    active: false
    image: "spark-southbyte-image:v2"
    notes: "PENDING 2026-08-11: wie klein-9b — braucht die vollen FLUX.2-dev-Pipeline-Komponenten (text_encoder/VAE/tokenizer) lokal; aktuell nur Transformer-Weights gesynct."
